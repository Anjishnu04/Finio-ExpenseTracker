<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#a855f7" stopOpacity="1" />
      <stop offset="50%" stopColor="#7c3aed" stopOpacity="1" />
      <stop offset="100%" stopColor="#3b82f6" stopOpacity="1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#faviconGrad)" />
  
  <!-- Wallet icon -->
  <g transform="translate(32, 32)">
    <!-- Wallet body -->
    <rect x="-14" y="-8" width="28" height="16" rx="2" fill="white" opacity="0.95" />
    <!-- Card slot -->
    <rect x="-12" y="-5" width="20" height="3" rx="1" fill="url(#faviconGrad)" />
    <!-- Money symbol Circle -->
    <circle cx="0" cy="6" r="2.5" fill="url(#faviconGrad)" />
    <!-- Money symbol lines -->
    <path d="M -2 4 L 2 4 M 0 2 L 0 6" stroke="url(#faviconGrad)" strokeWidth="1" fill="none" strokeLinecap="round" />
  </g>
</svg>